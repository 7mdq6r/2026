name: Deploy Tasbih to GitHub Pages

on:
  push:
    branches:
      - claude/clarify-session-purpose-bGCzb
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage site under /tasbih/
        run: |
          mkdir -p _site/tasbih
          cp -r tasbih/www/. _site/tasbih/
          cat > _site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="ar" dir="rtl"><head>
          <meta charset="UTF-8">
          <meta http-equiv="refresh" content="0; url=./tasbih/">
          <title>سبحة</title>
          </head><body>
          <p><a href="./tasbih/">افتح تطبيق السبحة</a></p>
          </body></html>
          HTML

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
